name: 나라장터 입찰공고 수집

# 결과는 bid-data 브랜치에만 올린다. master 를 건드리지 않으므로
# Pages 배포(deploy-pages.yml)를 깨우지 않는다.
# 2026-08 에 cron 실행이 대기 중인 배포를 취소시켜 배포가 막힌 적이 있어,
# 별도 concurrency 그룹으로 완전히 분리해 둔다.

on:
  schedule:
    # 매시 5분. 정각은 GitHub 스케줄러가 붐벼 밀리는 일이 잦다.
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      days:
        description: '조회 기간 (일)'
        required: false
        default: '14'

permissions:
  contents: write

concurrency:
  group: fetch-bids
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 키를 등록하기 전까지 매시간 실패 알림이 가면 곤란하므로,
      # 시크릿이 없으면 빨간불 대신 안내만 남기고 조용히 넘어간다.
      - name: 시크릿 확인
        id: key
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
        run: |
          if [ -z "$G2B_SERVICE_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::G2B_SERVICE_KEY 시크릿이 없어 수집을 건너뜁니다. Settings → Secrets and variables → Actions 에서 등록하세요."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 공고 수집
        if: steps.key.outputs.has_key == 'true'
        env:
          G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
          BID_KINDS: thng,cnstwk
          # 14일 × 물품+공사 ≈ API 호출 15회/실행. 하루 24회 실행하면 약 360회로
          # 개발계정 일일 한도(보통 1,000회) 안에 들어온다. 한도를 올렸거나
          # 줄여야 하면 이 값을 조절할 것.
          BID_DAYS: ${{ github.event.inputs.days || '14' }}
        run: node tools/fetch-bids.mjs out/bids.json

      - name: bid-data 브랜치에 올리기
        if: steps.key.outputs.has_key == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b bid-data
          git add bids.json
          git commit -q -m "공고 수집 $(date -u +'%Y-%m-%d %H:%M UTC')"
          # 항상 한 개의 커밋만 남긴다. 매시간 커밋을 쌓으면 저장소가 계속 커진다.
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bid-data
          echo "올림: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/bid-data/bids.json"
