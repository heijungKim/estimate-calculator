name: Deploy static site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  # 30분 cron 자동 재시도는 제거함.
  # 대기 중인 실행이 있을 때 새 cron 실행이 그 실행을 취소해버려
  # 배포가 영영 시작되지 못하는 문제가 있었음(2026-08-06 ~ 08-12).
  # 배포가 막히면 workflow_dispatch 로 수동 재시도할 것.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check image restoration
        run: node --test tools/imageconvert.test.cjs
      - name: Check bid proxy
        run: node --test tools/bid-worker.test.mjs
      - name: Prepare public files
        run: |
          mkdir -p _site
          cp *.html *.css *.js *.svg .nojekyll _site/
          cp -R lib _site/lib
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000        # 게시 큐 지연 대비 대기 30분으로 확대
          error_count: 30
