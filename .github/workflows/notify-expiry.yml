name: 만료 알림 (디스코드)

# 등록유효기간이 지나면 그 품명으로는 입찰에 못 들어가고, 쇼핑몰 계약이
# 끝나면 상품이 내려간다. 투찰 당일에 알게 되면 손쓸 방법이 없어 미리 알린다.
#
# 며칠 전부터 알릴지는 company.json 의 notify 가 정한다
# (등록물품·인증 30일, 쇼핑몰 계약 90일).
#
# 보낸 기록은 bot-state 브랜치에 남긴다. 없으면 매일 같은 알림이 온다.

on:
  schedule:
    # 매일 00:10 UTC = 09:10 KST. 출근해서 보게.
    - cron: '10 0 * * *'
  workflow_dispatch:
    inputs:
      test:
        description: '시험 메시지 보내기 (만료 여부와 무관)'
        required: false
        default: 'false'
      reset:
        description: '보낸 기록 초기화'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: notify-expiry
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 웹훅이 없으면 빨간불 대신 안내만 남기고 조용히 넘어간다.
      - name: 웹훅 확인
        id: hook
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "has=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DISCORD_WEBHOOK_URL 시크릿이 없어 알림을 건너뜁니다."
          else
            echo "has=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 이전에 보낸 기록 가져오기
        if: steps.hook.outputs.has == 'true'
        run: |
          mkdir -p state
          if [ "${{ github.event.inputs.reset }}" = "true" ]; then
            echo '{}' > state/notify-state.json
            echo "기록 초기화"
          else
            curl -sfL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/bot-state/notify-state.json" \
              -o state/notify-state.json || echo '{}' > state/notify-state.json
          fi
          cat state/notify-state.json

      - name: 만료 확인 후 알림
        if: steps.hook.outputs.has == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.test }}" = "true" ]; then
            node tools/notify-expiry.mjs --test state/notify-state.json
          else
            node tools/notify-expiry.mjs state/notify-state.json
          fi

      - name: 보낸 기록 저장
        if: steps.hook.outputs.has == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd state
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b bot-state
          git add notify-state.json
          git commit -q -m "알림 기록 $(date -u +'%Y-%m-%d %H:%M UTC')"
          # 기록만 남기면 되므로 커밋 하나로 유지한다.
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bot-state
