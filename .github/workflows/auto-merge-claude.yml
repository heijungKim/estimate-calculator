name: Claude 브랜치 자동 반영

# claude/ 브랜치에 올라온 변경을 master 에 합치고 바로 배포한다.
# GITHUB_TOKEN 으로 한 push 는 다른 워크플로를 깨우지 않아서
# 배포는 workflow_dispatch 로 직접 실행한다.
# master 와 충돌하면 합치지 않고 실패로 끝난다.

on:
  push:
    branches: ['claude/**']

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-merge-claude
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: master 에 합치기
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          if git merge-base --is-ancestor "origin/$BRANCH" HEAD; then
            echo "이미 master 에 들어 있음"; exit 0
          fi
          git merge --no-edit "origin/$BRANCH" -m "자동 반영: $BRANCH"
          git push origin master
          echo "MERGED=true" >> "$GITHUB_ENV"

      - name: 배포 실행
        if: env.MERGED == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref master --repo "$GITHUB_REPOSITORY"
